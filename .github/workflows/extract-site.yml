name: Extract site files

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/extract-site.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract site archive
        run: |
          unzip -o aac-github-source-2026-11-14.zip
          rm aac-github-source-2026-11-14.zip
          rm -rf .github/workflows/extract-site.yml
      - name: Commit extracted files
        run: |
          git config user.name "allaboardcontractors"
          git config user.email "allaboardcontractors@users.noreply.github.com"
          git add -A
          git commit -m "Extract All Aboard Contractors site files" || echo "Nothing to commit"
          git push
